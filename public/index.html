<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu School - Sistema de Comedor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <div class="logo-container">
                    <!-- AGREGAR LOGO DEL COMEDOR AQUÍ -->
                    <div class="logo-placeholder">
                        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path>
                            <path d="M7 2v20"></path>
                            <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path>
                        </svg>
                    </div>
                    <h1>MENU SCHOOL</h1>
                </div>
                <p class="subtitle">Sistema de Gestión de Comedor Escolar</p>
            </div>

            <!-- Formulario Principal -->
            <form id="formularioIngreso" class="form-container">
                <div class="form-group">
                    <label for="centroEducativo">Centro Educativo</label>
                    <input type="text" id="centroEducativo" placeholder="Ej: Liceo Duarte" required>
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" required>
                </div>

                <div class="form-group">
                    <label for="nombreEstudiante">Nombre del Estudiante</label>
                    <input type="text" id="nombreEstudiante" placeholder="Nombre completo" required>
                </div>

                <div class="form-group">
                    <label for="nombreTutor">Nombre del Tutor</label>
                    <input type="text" id="nombreTutor" placeholder="Padre o Madre">
                </div>

                <div class="form-group">
                    <label for="centroAnterior">Centro Educativo Anterior</label>
                    <input type="text" id="centroAnterior" placeholder="Opcional">
                </div>

                <button class="btn btn-primary" type="submit">
                    <span>Entrar al Comedor</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </form>

            <!-- Login Administrador -->
            <div id="loginAdmin" class="login-admin-container" style="display:none;">
                <h3>Acceso Administrador</h3>
                <div class="form-group">
                    <label for="adminUser">Usuario</label>
                    <input type="text" id="adminUser" placeholder="Ingrese su usuario">
                </div>
                <div class="form-group">
                    <label for="adminPass">Contraseña</label>
                    <input type="password" id="adminPass" placeholder="Ingrese su contraseña">
                </div>
                <button class="btn btn-admin" onclick="loginAdmin()">Entrar como Administrador</button>
            </div>

            <!-- Botones de Acción -->
            <div class="action-buttons">
                <button class="btn-link" onclick="toggleLogin()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13.8 12H3"/>
                    </svg>
                    Iniciar sesión como Administrador
                </button>
                <button class="btn-link" onclick="registrarUsuario()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <line x1="19" y1="8" x2="19" y2="14"/>
                        <line x1="22" y1="11" x2="16" y2="11"/>
                    </svg>
                    Registrarse
                </button>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
